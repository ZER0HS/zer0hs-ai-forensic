name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zer0hs_ai_forensic/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: zer0hs_ai_forensic/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # LLM_PROVIDER/keys are also force-set in tests/conftest.py; set
        # here too so nothing outside pytest can accidentally reach a live
        # service if a test is ever run without going through conftest.
        env:
          LLM_PROVIDER: ollama
          ABUSEIPDB_API_KEY: ""
          VIRUSTOTAL_API_KEY: ""
          URLSCAN_API_KEY: ""
        run: pytest -v

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zer0hs_ai_forensic/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zer0hs_ai_forensic/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high
