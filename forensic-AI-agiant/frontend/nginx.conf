server {
    listen 80;
    server_name _;

    # vite.config.js sets base: '/forensic-AI-agiant/', so the built
    # index.html and every asset URL expect to live under that path —
    # redirect the bare root there instead of 404ing.
    location = / {
        return 302 /forensic-AI-agiant/;
    }

    location /forensic-AI-agiant/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /forensic-AI-agiant/index.html;
    }
}
