server {
    listen 80;
    server_name _;

    # vite.config.js sets base: '/zer0hs_ai_forensic/', so the built
    # index.html and every asset URL expect to live under that path —
    # redirect the bare root there instead of 404ing.
    location = / {
        return 302 /zer0hs_ai_forensic/;
    }

    location /zer0hs_ai_forensic/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /zer0hs_ai_forensic/index.html;
    }
}
