services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # host.docker.internal lets the backend container reach Ollama
      # running on the host machine — override in backend/.env if Ollama
      # runs elsewhere (a GPU box, a separate container, etc.).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    volumes:
      # Case history persists across container restarts.
      - backend_feedback:/app/feedback
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_KEY: ${VITE_API_KEY:-}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_feedback:
